[workspace]
resolver = "3"
members = ["crates/ensabc-duckdb", "crates/ensabc-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"

[workspace.dependencies]
duckdb = { version = "=1.10505.0", default-features = false, features = [
    "loadable-extension",
] }
nalgebra = { version = "=0.35.0", default-features = false, features = ["std"] }
rand = { version = "=0.9.2", default-features = false, features = ["std"] }
rand_chacha = { version = "=0.9.0", default-features = false, features = ["std"] }
serde = { version = "1.0", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
ensabc-core = { path = "crates/ensabc-core" }
